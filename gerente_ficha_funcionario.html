<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ee0101">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <title>Ficha do Funcionário | Gerente de Produção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script type="module">
        import { protegerPagina } from "./js/page-auth.js";
        await protegerPagina({ perfis: ["administrador", "gerente_producao"], destino: "gerente_painel.html" });
    </script>
</head>
<body class="bg-light p-4">
<div class="container mb-3 app-topbar">
    <div class="d-flex justify-content-between align-items-center">
        <div class="app-brand">
            <div class="app-brand-mark">I</div>
            <div>
                <div class="app-brand-title">Projeto Funcionários</div>
                <div class="app-brand-subtitle">Indemetal Etiquetas · Gerente de Produção · Visualização</div>
            </div>
        </div>
        <a href="gerente_funcionarios.html" class="btn btn-sm btn-outline-secondary">← Voltar à lista</a>
    </div>
</div>

<div class="container" style="max-width: 960px;">
    <div class="card shadow-sm p-4">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h3 class="mb-0">Ficha Individual</h3>
            <span class="badge text-bg-warning fs-6">Somente leitura</span>
        </div>

        <div id="dadosFuncionario" class="mb-4"></div>

        <!-- Linha do tempo — somente leitura -->
        <div class="d-flex flex-wrap align-items-center gap-3 mb-2">
            <h5 class="mb-0">Linha do tempo</h5>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <label for="filtroAnoDiario" class="form-label mb-0 small text-muted">Ano:</label>
                <select id="filtroAnoDiario" class="form-select form-select-sm" style="width:100px;">
                    <option value="">Todos</option>
                </select>
            </div>
        </div>
        <div class="table-responsive mb-4">
            <table class="table table-bordered table-striped">
                <thead class="table-primary">
                    <tr>
                        <th style="width:130px">Data</th>
                        <th style="width:120px">Tipo</th>
                        <th>Registro</th>
                    </tr>
                </thead>
                <tbody id="tabelaDiario"></tbody>
            </table>
        </div>

        <!-- Histórico de férias — somente leitura -->
        <div class="d-flex flex-wrap align-items-center gap-3 mb-2">
            <h5 class="mb-0">Histórico de Férias</h5>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <label for="filtroAnoFerias" class="form-label mb-0 small text-muted">Ano:</label>
                <select id="filtroAnoFerias" class="form-select form-select-sm" style="width:100px;">
                    <option value="">Todos</option>
                </select>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-primary">
                    <tr>
                        <th>Data Início</th>
                        <th>Data Fim</th>
                        <th>Observação</th>
                    </tr>
                </thead>
                <tbody id="tabelaFerias"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import {
        formatarDataBr,
        calcularTempoEmpresa,
        calcularTempoPermanencia,
        funcionarioAtivo,
        ordenarHistorico,
        obterLabelTipoRegistro,
        obterClasseTipoRegistro
    } from "./js/app-utils.js";
    import { iniciarApp, obterFuncionario } from "./js/firebase-db.js";

    let funcionarioAtual = null;

    function obterIdFuncionario() {
        return new URLSearchParams(window.location.search).get("id");
    }

    function renderizarDadosFuncionario(f) {
        const eAtivo = funcionarioAtivo(f);
        const tempo = eAtivo
            ? calcularTempoEmpresa(f.dataRegistro)
            : calcularTempoPermanencia(f.dataRegistro, f.dataDispensa);
        const statusBadge = eAtivo
            ? '<span class="badge bg-success">Ativo</span>'
            : '<span class="badge bg-danger">Dispensado</span>';

        document.getElementById("dadosFuncionario").innerHTML = `
            <div class="card border-0 bg-white shadow-sm">
                <div class="card-body">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                        <div>
                            <h4 class="mb-1">${f.nomeFuncionario || "-"}</h4>
                            <p class="text-muted mb-0">Nº ${f.numeroRegistro || "-"} &middot; ${statusBadge}</p>
                        </div>
                        <div class="text-md-end">
                            <div class="small text-muted">Tempo na empresa</div>
                            <strong>${tempo}</strong>
                        </div>
                    </div>
                    <div class="row g-3 small">
                        <div class="col-md-4"><strong>Data admissão:</strong> ${formatarDataBr(f.dataRegistro)}</div>
                        <div class="col-md-4"><strong>Telefone:</strong> ${f.telefone || "-"}</div>
                        <div class="col-md-4"><strong>Função:</strong> ${f.funcaoFuncionario || "-"}</div>
                        <div class="col-md-4"><strong>Setor:</strong> ${f.setorTrabalho || f.setor || "-"}</div>
                        <div class="col-md-4"><strong>Turno:</strong> ${f.turnoTrabalho || "-"}</div>
                        <div class="col-md-4"><strong>Promoções:</strong> ${(() => {
                            const qtd = Number(f.quantidadePromocoes || 0);
                            if (!f.promovido && qtd === 0) return "Nenhuma";
                            return `${"🏅".repeat(qtd)} <span class="badge text-bg-warning">${qtd} promoção${qtd !== 1 ? "ões" : ""}</span>`;
                        })()}</div>
                        ${!eAtivo ? `
                            <div class="col-md-4"><strong>Data dispensa:</strong> ${formatarDataBr(f.dataDispensa)}</div>
                            <div class="col-md-8"><strong>Motivo:</strong> ${f.motivoDispensa || "-"}</div>
                        ` : ""}
                    </div>
                </div>
            </div>`;
    }

    function anosDeHistorico(lista, campoData) {
        return [...new Set(lista.map(i => (i[campoData] || "").slice(0, 4)).filter(Boolean))].sort((a, b) => b - a);
    }

    function preencherSelectAno(selectId, anos) {
        const sel = document.getElementById(selectId);
        const anterior = sel.value;
        sel.innerHTML = '<option value="">Todos</option>' +
            anos.map(a => `<option${a === anterior ? " selected" : ""}>${a}</option>`).join("");
    }

    function preencherTabelaDiario(historicoObservacoes) {
        const tabela = document.getElementById("tabelaDiario");
        const listaCompleta = ordenarHistorico(historicoObservacoes || []);
        const anoFiltro = document.getElementById("filtroAnoDiario").value;
        preencherSelectAno("filtroAnoDiario", anosDeHistorico(listaCompleta, "data"));
        const lista = listaCompleta.filter(i => !anoFiltro || (i.data || "").startsWith(anoFiltro));
        if (!lista.length) {
            tabela.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Nenhum registro encontrado para este período.</td></tr>';
            return;
        }
        tabela.innerHTML = lista.map(item => `
            <tr>
                <td>${formatarDataBr(item.data)}</td>
                <td><span class="badge ${obterClasseTipoRegistro(item.tipo || "observacao")}">${obterLabelTipoRegistro(item.tipo || "observacao")}</span></td>
                <td>${item.texto || "-"}</td>
            </tr>`).join("");
    }

    function preencherTabelaFerias(historicoFerias) {
        const tabela = document.getElementById("tabelaFerias");
        const listaCompleta = Array.isArray(historicoFerias) ? [...historicoFerias] : [];
        listaCompleta.sort((a, b) => (b.dataInicio || "").localeCompare(a.dataInicio || ""));
        const anoFiltro = document.getElementById("filtroAnoFerias").value;
        preencherSelectAno("filtroAnoFerias", anosDeHistorico(listaCompleta, "dataInicio"));
        const lista = listaCompleta.filter(i => !anoFiltro || (i.dataInicio || "").startsWith(anoFiltro));
        if (!lista.length) {
            tabela.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Nenhum período de férias encontrado.</td></tr>';
            return;
        }
        tabela.innerHTML = lista.map(item => `
            <tr>
                <td>${formatarDataBr(item.dataInicio)}</td>
                <td>${formatarDataBr(item.dataFim)}</td>
                <td>${item.observacao || "-"}</td>
            </tr>`).join("");
    }

    try {
        await iniciarApp();
        const id = obterIdFuncionario();
        if (!id) throw new Error("Nenhum funcionário selecionado.");

        funcionarioAtual = await obterFuncionario(id);
        if (!funcionarioAtual) throw new Error("Funcionário não encontrado ou sem permissão.");

        document.title = `Ficha: ${funcionarioAtual.nomeFuncionario || "Funcionário"} | Indemetal`;
        renderizarDadosFuncionario(funcionarioAtual);
        preencherTabelaDiario(funcionarioAtual.historicoObservacoes);
        preencherTabelaFerias(funcionarioAtual.historicoFerias);

        document.getElementById("filtroAnoDiario").addEventListener("change",
            () => preencherTabelaDiario(funcionarioAtual.historicoObservacoes));
        document.getElementById("filtroAnoFerias").addEventListener("change",
            () => preencherTabelaFerias(funcionarioAtual.historicoFerias));
    } catch (erro) {
        document.querySelector(".container:last-of-type").innerHTML =
            `<div class="alert alert-danger"><strong>Erro:</strong> ${erro.message}</div>`;
    }
</script>
</body>
</html>
